# Configuración del Radar IA de Fixed.
# Los nombres de modelo cambian seguido: corré `python -m radar_ia check` para validar
# que existan con tus keys antes de la primera corrida programada.

corridas_por_pregunta: 2
modos: [con_busqueda, sin_busqueda]
pais: UY                          # ubicación aproximada para la búsqueda web (OpenAI y Anthropic)
ciudad: Montevideo
max_busquedas_por_respuesta: 5    # tope de búsquedas web por respuesta (Anthropic)
max_tokens: 1500
concurrencia: 4                   # llamadas en paralelo por proveedor
concurrencia_por_proveedor:       # sobrescribe `concurrencia` (OpenAI con búsqueda pega en el límite de tokens/min)
  openai: 2
reintentar_fallas: true           # al final, una segunda pasada secuencial sobre las llamadas que fallaron

modelos:
  anthropic: claude-sonnet-5-5
  openai: gpt-5.5
  gemini: gemini-3.5-flash

# Modelo que lee cada respuesta y extrae menciones, orden, recomendación y exactitud.
# Usá uno barato y estable; no cambiarlo entre semanas para que las métricas sean comparables.
juez:
  proveedor: anthropic
  modelo: claude-haiku-5-5
  # versión del prompt del juez (radar_ia/extraer.py JUEZ_VERSION). v2 (2026-11-18): errores en 3 categorías,
  # omisiones, justificación del recomendado. La corrida 2026-11-17 se reprocesó con v2 sobre el crudo guardado.

# Salida
carpeta_resultados: resultados
drive:
  habilitado: true                # sube el resumen JSON y el HISTORIAL.md a Drive cada semana
  carpeta_id: 1p9Pq4Q1mqwHDZkEW1oEMbrMU_OpaiNcQ
