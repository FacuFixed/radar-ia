# Preguntas fijas. No cambiarlas entre semanas (si se cambia una, cambiá su id).
# Escritas como las haría un desarrollador o CTO uruguayo, sin nombrar a Fixed salvo en `marca`.
# intencion (v2, 2026-11-18): descubrimiento | comparacion | tecnico | precio | marca
#   descubrimiento = sin marca, "¿qué proveedor uso?": base de los KPIs principales.
#   comparacion = compara proveedores (con o sin nombrar a Fixed). marca = pregunta por Fixed.
# Los ids no cambian al reetiquetar; el esquema anterior (categoria/integracion/prueba/ia) se migró por id.

