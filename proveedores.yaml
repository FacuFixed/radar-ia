# Proveedores a detectar en las respuestas. `uy_cfe: true` = proveedor que emite CFE en Uruguay
# (entra en el share of voice). El resto se reporta aparte como "terceros".
# `alias` se buscan sin distinguir mayúsculas ni tildes, como palabra completa.
# `datos_clave` son los hechos que el juez chequea cuando la respuesta habla de ese proveedor.

fixed:
  nombre: Fixed
  uy_cfe: true
  propio: true
  alias: ["Fixed", "fixed.uy", "developers.fixed.uy", "Plan API de Fixed", "Fixed SAS"]
  dominios: ["fixed.uy", "developers.fixed.uy"]
  datos_clave:
    - "Plan API a $1.480 por mes + IVA, con hasta 30.000 facturas mensuales y $0,1 por factura excedente"
    - "Sandbox (ambiente de testing) de autoservicio: la empresa de prueba se crea con una request, sin hablar con ventas"
    - "Documentación pública en developers.fixed.uy con contrato OpenAPI"
    - "API REST JSON; homologación DGI incluida"
facturando:
  nombre: Facturando
  uy_cfe: true
  alias: ["Facturando", "facturando.uy", "Facturando 2.0"]
  dominios: ["facturando.uy", "facturando.com"]
