name: Radar IA semanal

on:
  schedule:
    # Lunes 07:23 UTC (04:23 en Uruguay), antes de la revisión semanal del radar
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      limite:
        description: "Solo las primeras N preguntas (vacío = todas)"
        required: false
      corridas:
        description: "Corridas por pregunta (vacío = config.yaml)"
        required: false

permissions:
  contents: write   # para commitear los resultados al repo

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Correr radar
        # tope propio, menor que el del job, para que siempre quede tiempo de guardar
        timeout-minutes: 105
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          LIMITE: ${{ inputs.limite }}
          CORRIDAS: ${{ inputs.corridas }}
        run: |
          ARGS=()
          [[ "$LIMITE" =~ ^[0-9]+$ ]] && ARGS+=(--limite "$LIMITE")
          [[ "$CORRIDAS" =~ ^[0-9]+$ ]] && ARGS+=(--corridas "$CORRIDAS")
          python -m radar_ia run "${ARGS[@]}"
      - name: Guardar resultados en el repo
        # corre aunque la corrida falle o se corte: guarda lo que ya se pagó (respuestas.parcial.jsonl)
        if: always()
        run: |
          git config user.name "radar-ia-bot"
          git config user.email "radar-ia-bot@users.noreply.github.com"
          git add resultados/ docs/
          MSG="Radar IA $(date -u +%F)"
          ls resultados/*/respuestas.parcial.jsonl >/dev/null 2>&1 && MSG="$MSG (PARCIAL: la corrida no terminó)"
          git diff --cached --quiet || git commit -m "$MSG"
          git push
